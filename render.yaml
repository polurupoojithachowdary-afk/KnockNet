services:
  - type: web
    name: knocknet-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
