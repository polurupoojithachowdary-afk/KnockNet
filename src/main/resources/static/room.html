<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knocknet — Conference Room</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/room.css">
</head>
<body>
  <!-- Ambient 3D Fluid Canvas Backdrop -->
  <canvas id="fluid-canvas"></canvas>

  <div class="room-layout">
    <!-- Top Header -->
    <header class="room-header">
      <div class="header-left">
        <a href="/" title="Return to Landing">
          <img src="/img/knocknet-logo.svg" alt="Knocknet" class="room-brand-logo">
        </a>
        <div class="room-code-chip" id="chip-room-code" title="Click to copy access code">
          <span style="opacity: 0.6;">TOKEN:</span>
          <span id="header-code-val">------</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </div>
      </div>

      <div class="header-center">
        <span class="call-timer" id="call-timer-display">00:00:00</span>
      </div>

      <div class="header-right">
        <div class="participant-badge" id="participant-counter">
          <span class="p-dot"></span>
          <span id="participant-count-text">1 PEER</span>
        </div>
      </div>
    </header>

    <!-- Dynamic Video Mesh Stage -->
    <main class="video-stage grid-1" id="video-stage">
      <!-- Local User Video Tile -->
      <div class="video-tile local-tile" id="tile-local">
        <video id="local-video" autoplay playsinline muted></video>
        
        <!-- Fallback avatar when camera is off -->
        <div class="avatar-placeholder" id="local-avatar">
          <div class="avatar-circle" id="local-avatar-initials">YOU</div>
          <div style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--secondary-muted);">VIDEO MUTED</div>
        </div>

        <!-- Participant Tag -->
        <div class="tile-overlay">
          <div class="participant-name-tag">
            <span id="local-display-name">YOU</span>
            <span class="local-indicator">HOST</span>
          </div>

          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <!-- Realtime Audio Level Meter -->
            <div class="audio-level-meter" id="local-audio-meter">
              <div class="audio-meter-bar" style="height: 4px;"></div>
              <div class="audio-meter-bar" style="height: 7px;"></div>
              <div class="audio-meter-bar" style="height: 10px;"></div>
            </div>
            
            <!-- Muted Icon -->
            <svg class="mute-indicator-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="1" y1="1" x2="23" y2="23"></line>
              <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
              <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </div>
        </div>
      </div>
      <!-- Remote Peer Tiles will be dynamically injected here -->
    </main>

    <!-- Bottom Control Dock -->
    <footer class="control-dock-wrapper">
      <div class="control-dock">
        <!-- Mic Toggle -->
        <button type="button" class="btn-dock-action" id="btn-toggle-mic" title="Mute / Unmute Microphone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <!-- Camera Toggle -->
        <button type="button" class="btn-dock-action" id="btn-toggle-cam" title="Start / Stop Camera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        </button>

        <!-- Screen Share -->
        <button type="button" class="btn-dock-action" id="btn-toggle-screen" title="Share Screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </button>

        <!-- Session Token / Invite Info -->
        <button type="button" class="btn-dock-action" id="btn-open-invite" title="Session Invite Token">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
        </button>

        <!-- Leave Call -->
        <button type="button" class="btn-dock-leave" id="btn-leave-call" title="Disconnect from Conference">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>LEAVE</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- Session Token & Invite Modal -->
  <div class="room-modal-backdrop" id="invite-modal">
    <div class="room-modal">
      <div class="modal-header">
        <h3>SESSION ACCESS DETAILS</h3>
        <button type="button" class="btn-close-modal" id="btn-close-invite">&times;</button>
      </div>

      <div>
        <div style="font-size: 0.75rem; font-family: var(--font-mono); color: var(--secondary-muted); margin-bottom: 6px;">
          ACTIVE 6-DIGIT CODE
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; background: #0b0f15; padding: 0.75rem 1rem; border: 1px solid var(--surface-border);">
          <span style="font-family: var(--font-mono); font-size: 1.8rem; font-weight: 700; color: var(--primary); letter-spacing: 0.2em;" id="modal-code-display">------</span>
          <button type="button" class="btn-dock-action" id="btn-copy-code-only" style="width: 36px; height: 36px;" title="Copy Code">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>

      <div>
        <div style="font-size: 0.75rem; font-family: var(--font-mono); color: var(--secondary-muted); margin-bottom: 6px;">
          DIRECT JOIN LINK
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <input type="text" id="modal-link-input" readonly style="flex: 1; background: #0b0f15; border: 1px solid var(--surface-border); color: var(--secondary); font-family: var(--font-mono); font-size: 0.78rem; padding: 0.6rem 0.8rem; outline: none;">
          <button type="button" id="btn-modal-copy-link" style="background: var(--primary); border: none; color: #0c1218; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; padding: 0 1rem; cursor: pointer;">COPY</button>
        </div>
      </div>

      <div>
        <button type="button" id="btn-refresh-code" style="width: 100%; background: transparent; border: 1px solid var(--primary); color: var(--primary); font-family: var(--font-mono); font-size: 0.78rem; font-weight: 600; padding: 0.75rem; cursor: pointer; transition: all 0.2s ease;">
          REGENERATE FRESH 60s TOKEN
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-notice" id="room-toast">Notice</div>

  <!-- Scripts -->
  <script src="/js/fluid.js"></script>
  <script src="/js/webrtc.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
