spring.application.name=Knocknet
server.port=${PORT:8080}
server.forward-headers-strategy=framework
app.frontend-origins=${FRONTEND_ORIGINS:https://example.invalid}
app.firebase.project-id=${FIREBASE_PROJECT_ID:knocknet-not-configured}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Secrets belong in the backend environment, never the browser bundle or Git.
app.nvidia.api-key=${NVIDIA_API_KEY:}
app.nvidia.whisper-function-id=${NVIDIA_WHISPER_FUNCTION_ID:b702f636-f60c-4a3d-a6f4-f3568c13bd7d}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
