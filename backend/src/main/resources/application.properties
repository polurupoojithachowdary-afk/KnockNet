spring.application.name=Knocknet
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# FRONTEND_ORIGINS accepts a comma-separated production/preview origin list.
app.frontend-origins=${FRONTEND_ORIGINS:https://example.invalid}
app.firebase.project-id=${FIREBASE_PROJECT_ID:knocknet-not-configured}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
