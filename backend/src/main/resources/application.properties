spring.application.name=Knocknet
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# FRONTEND_ORIGINS accepts a comma-separated production/preview origin list.
app.frontend-origins=${FRONTEND_ORIGINS:https://example.invalid}
app.firebase.project-id=${FIREBASE_PROJECT_ID:knocknet-not-configured}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# NVIDIA NIM API key for voice translation (push-to-talk POC).
# Get a free key from https://build.nvidia.com — sign in, any model page, "Get API Key".
app.nvidia.api-key=${NVIDIA_API_KEY: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}

# Allow audio uploads up to 6 MB (covers ~30s WAV at 16-bit/16kHz)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
